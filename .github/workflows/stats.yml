name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      
      # NEW: Cleans out old SVGs so the actions are forced to build them fresh
      - name: Clean old SVG files
        run: |
          mkdir -p profile
          rm -f profile/*.svg
          
      - name: Generate GitHub Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          filename: profile/github-metrics.svg
          output_action: commit
          committer_token: "" 
          template: classic
          config_timezone: America/Los_Angeles
          
          # Base framework control
          base: header, activity, community, repositories, metadata
          config_padding: 0, 8
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
          
          # Forces the code text elements to align with your lifetime totals
          plugin_lines: yes
          repositories_affiliations: owner, collaborator, organization_member

          # Maps out the granular year-by-year ratios in your statistics array
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_trim: no
          
          # Preserves your multi-year visual grid roadmap at the bottom
          plugin_calendar: yes
          plugin_calendar_limit: 5


      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # Force add the entire profile directory containing the SVGs
          git add profile/*.svg
          
          # Commit and push changes directly if files are updated
          if ! git diff --staged --quiet; then
            git commit -m "Update README cards"
            git push
          else
            echo "No visual file updates detected."
          fi
