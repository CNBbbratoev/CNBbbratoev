name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          filename: profile/github-metrics.svg
          output_action: none
          template: classic
          config_timezone: America/Los_Angeles
          
          # 1. Keeps the detailed text blocks
          base: header, activity, community, repositories, metadata
          config_padding: 0, 8
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
          
          # 2. Displays detailed breakdown sections (PRs, Issues, Reviews)
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_lines: yes
          
          # 3. Keeps your 4-year calendar view embedded at the bottom
          plugin_calendar: yes
          plugin_calendar_limit: 5


      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.STATS_PAT }}

      # Now this step aggregates ALL files (the root one and the profile ones) cleanly
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # Stage your explicit paths
          git add profile/github-metrics.svg profile/top-langs.svg profile/pin-stats-organization-github-readme-stats.svg
          
          # Commits only if changes exist, preventing ghost skip notices
          git diff --staged --quiet || git commit -m "Update README cards"
          git push

