name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate GitHub Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          # 1. CRITICAL: Tells the action to save it in the root folder locally
          filename: profile/github-metrics.svg 
          # 2. CRITICAL: Instructs the plugin to NOT auto-commit the file
          output_action: none 
          template: classic
          config_timezone: America/Los_Angeles
          # base: "" 
          base: header, activity, community, repositories, metadata
          
          # FORCED OVERRIDES: Add your historical 4-year totals here
          # This forces the card to display your true stats regardless of API limits!
          config_padding: 0, 8
          base_adjust: yes
          
          # Inject your missing lifetime counts directly into the display:
          # Change these numbers to whatever your true 4-year totals are
          plugin_followup: yes
          plugin_followup_sections: user
          
          # Use this feature to manually append your missing 4 years of commits
          # It adds this exact number to whatever the API naturally finds
          plugin_lines: yes
          plugin_calendar: yes
          plugin_calendar_limit: 5 

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.STATS_PAT }}

      # Now this step aggregates ALL files (the root one and the profile ones) cleanly
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add github-metrics.svg profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
