name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # 1. Clean out legacy directory trees
      - name: Clean old SVG files
        run: |
          git rm -rf profile/ || true
          mkdir -p profile/3d

      # Year 2026 (Current Year) - Upgraded to @main to support environment features
      - name: Generate 2026 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2026
      - name: Save 2026 Data
        run: |
          mv -f profile-3d-contrib/profile-night-green.svg profile/3d/3d-2026.svg || true
          rm -rf profile-3d-contrib/

      # Year 2025
      - name: Generate 2025 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2025
      - name: Save 2025 Data
        run: |
          mv -f profile-3d-contrib/profile-night-green.svg profile/3d/3d-2025.svg || true
          rm -rf profile-3d-contrib/

      # Year 2024
      - name: Generate 2024 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2024
      - name: Save 2024 Data
        run: |
          mv -f profile-3d-contrib/profile-night-green.svg profile/3d/3d-2024.svg || true
          rm -rf profile-3d-contrib/

      # Year 2023
      - name: Generate 2023 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2023
      - name: Save 2023 Data
        run: |
          mv -f profile-3d-contrib/profile-night-green.svg profile/3d/3d-2023.svg || true
          rm -rf profile-3d-contrib/

      # Year 2022
      - name: Generate 2022 3D Graph
        uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}
          YEAR: 2022
      - name: Save 2022 Data
        run: |
          mv -f profile-3d-contrib/profile-night-green.svg profile/3d/3d-2022.svg || true
          rm -rf profile-3d-contrib/

      # Standard languages integration step
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      # 2. Push distinct timeline assets cleanly to your repository
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          git add profile/*.svg profile/3d/*.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "Update multi-year night green 3D blocks via environmental variables"
            git push
          fi
