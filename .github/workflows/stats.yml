name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      
      # NEW: Cleans out old SVGs so the actions are forced to build them fresh
      - name: Clean old SVG files
        run: |
          mkdir -p profile
          rm -f profile/*.svg
 # NEW: Option 2 Generation Step (Pulls all private contributions)
      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_PAT }}
          USERNAME: ${{ github.repository_owner }}

      # Moves the generated 3D files inside your primary profile asset folder
      - name: Move 3D assets to profile directory
        run: |
          mkdir -p profile/3d
          mv -f profile-3d-contrib/* profile/3d/ || true
          
      - name: Generate GitHub Metrics Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_PAT }}
          user: ${{ github.repository_owner }}
          filename: profile/github-metrics.svg
          output_action: commit
          committer_token: "" 
          template: classic
          config_timezone: America/Los_Angeles
          
          # REMOVED: repositories_affiliations (Restores default wide search matrices)
          # REMOVED: plugin_commits_authoring_branches (Prevents historical timeline API cutoffs)
          
          # Base structure alignment
          base: header, activity, community, repositories, metadata
          config_padding: 0, 8
          config_order: base.header, base.activity, base.community, base.repositories, base.metadata
          
          # Keep your target layout trackers
          plugin_followup: yes
          plugin_followup_sections: user
          
          # Preserves your multi-year lines analytics and visual grid blocks
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_calendar: yes
          plugin_calendar_limit: 5



      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: profile/pin-stats-organization-github-readme-stats.svg
          token: ${{ secrets.STATS_PAT }}

# 2. Tracks and commits all your asset subdirectories cleanly
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          # Adds the language card, the pin card, and all generated 3D themes
          git add profile/*.svg profile/3d/*.svg
          
          if ! git diff --staged --quiet; then
            git commit -m "Update README cards with 3D stats"
            git push
          else
            echo "No visual updates found."
          fi
